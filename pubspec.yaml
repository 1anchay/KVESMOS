name: orbitwords
description: Free offline language journeys. Original English A1 course for Russian speakers.
publish_to: none
version: 0.6.0-dev.1+8
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: ^2.7.6
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  supabase_flutter: ^2.10.0
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.3
  speech_to_text: ^7.3.0
  flutter_local_notifications: ^19.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15
flutter:
  uses-material-design: true
  fonts:
    - family: OrbitSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
  assets:
    - assets/courses/
    - assets/kvesmos/
    - assets/audio/effects/
    - assets/audio/voices/
    - assets/audio/voices/clips/
    - assets/audio/voices/licenses/
    - assets/courses/demo/
