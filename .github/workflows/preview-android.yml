name: Android Preview
on:
  push:
    branches:
      - feature/lesson-coaching-voice-honesty
      - feature/kvesmos-v05-quality
      - codex/kvesmos-v06-alive
      - feature/kvesmos-v07-learning-game
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Restore stable preview signing key
        env:
          PREVIEW_KEY: ${{ secrets.KVESMOS_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$PREVIEW_KEY" || { echo 'Preview signing secret is missing; refusing a random signing key.'; exit 1; }
          key_path="$RUNNER_TEMP/kvesmos-preview.jks"
          printf '%s' "$PREVIEW_KEY" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "KVESMOS_PREVIEW_KEYSTORE=$key_path" >> "$GITHUB_ENV"
      - name: Build ARM64 debug APK
        run: flutter build apk --debug --target-platform=android-arm64 --target lib/main.dart
      - name: Record checksum and certificate
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app-debug.apk > signing-certificate.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: b8c558730dd20651119dd74b014b31ff51f076af208198dc79e05e51a0dca8be' signing-certificate.txt || { echo 'Unexpected preview certificate; refusing publication.'; exit 1; }
      - name: Upload build for verification
        uses: actions/upload-artifact@v4
        with:
          name: KVESMOS-preview-arm64-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/app/outputs/flutter-apk/signing-certificate.txt
          if-no-files-found: error
